name: Lamha Daily Video

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lamha-video
  cancel-in-progress: false

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Arabic fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0

      - name: Install packages
        run: pip install -U -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          MAX_SECONDS: "20"
          LOGO_TEXT: "#لمحة"
        run: python generate_facts.py

      - name: Save history
        run: |
          git config user.name "asmr-bot"
          git config user.email "asmr-bot@users.noreply.github.com"
          git add history.json
          git commit -m "update history" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "push failed, retry $i"; sleep 5
          done
          echo "::error::Could not save history.json"; exit 1

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Prepare video page
        run: |
          mkdir -p site
          D="$(ls -d output/*/ | tail -1)"
          cp "${D}video.mp4" "site/v${{ github.run_id }}.mp4"
          if [ -f "${D}video_tiktok.mp4" ]; then cp "${D}video_tiktok.mp4" "site/t${{ github.run_id }}.mp4"; else cp "${D}video.mp4" "site/t${{ github.run_id }}.mp4"; fi
          echo "ok" > site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Host video on GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Host video on GitHub Pages (retry)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Publish
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLISH_PLATFORMS: "youtube,tiktok,facebook"
          VIDEO_URL: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}v${{ github.run_id }}.mp4
          TIKTOK_VIDEO_URL: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}t${{ github.run_id }}.mp4
        run: python publish.py
