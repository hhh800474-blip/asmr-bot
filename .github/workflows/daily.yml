name: ASMR Daily Video

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          VIDEO_SECONDS: "15"
          CONTENT_LANG: "en"
        run: python generate_video.py

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Save history
        run: |
          git config user.name "asmr-bot"
          git config user.email "asmr-bot@users.noreply.github.com"
          git add history.json
          git commit -m "update history" || echo "no changes"
          git push
