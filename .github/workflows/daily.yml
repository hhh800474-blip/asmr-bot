name: Lamha Daily Video

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Arabic fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          MAX_SECONDS: "15"
          LOGO_TEXT: "#لمحة"
        run: python generate_facts.py

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Prepare video page
        run: |
          mkdir -p site
          cp "$(ls -d output/*/ | tail -1)video.mp4" "site/v${{ github.run_id }}.mp4"
          echo "ok" > site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Host video on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLISH_PLATFORMS: "youtube,tiktok,facebook"
          VIDEO_URL: ${{ steps.deployment.outputs.page_url }}v${{ github.run_id }}.mp4
        run: python publish.py

      - name: Save history
        if: always()
        run: |
          git config user.name "asmr-bot"
          git config user.email "asmr-bot@users.noreply.github.com"
          git add history.json || true
          git commit -m "update history" || echo "no changes"
          git push || true
